name: API surface

on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Compare the reference wikis against the recorded surface
        run: ./gradlew wikiApiCheck --stacktrace

      - name: Report what the beta cluster is about to ship
        if: always()
        continue-on-error: true
        run: ./gradlew wikiApiBetaCheck --stacktrace

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-surface-report
          path: kwikibot-tools/build/reports/api-surface/
          if-no-files-found: ignore
