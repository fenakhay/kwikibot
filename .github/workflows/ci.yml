name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
            binary: kwikibot-cli/build/bin/linuxX64/releaseExecutable/kwikibot.kexe
          - os: macos-26
            target: macosArm64
            binary: kwikibot-cli/build/bin/macosArm64/releaseExecutable/kwikibot.kexe
          - os: windows-latest
            target: mingwX64
            binary: kwikibot-cli/build/bin/mingwX64/releaseExecutable/kwikibot.exe
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Check, and link the release kwikibot
        run: ./gradlew check detekt checkKotlinAbi koverXmlReport :kwikibot-cli:${{ matrix.target }}AppArchive -x liveTest --stacktrace

      - name: Smoke-test the release kwikibot
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          "$BINARY" version
          "$BINARY" detect https://en.wiktionary.org
          "$BINARY" whoami --contact https://example.org/kwikibot-ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 26

      - name: Smoke-test the npm package
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./gradlew :kwikibot-js:jsNodeProductionLibraryDistribution --stacktrace
          npm pack ./kwikibot-js/build/dist/js/productionLibrary --pack-destination "$RUNNER_TEMP"
          cd kwikibot-js/smoke
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/kwikibot-*.tgz
          node detect.mjs https://example.org/kwikibot-ci
          node dump.mjs
          node fleet.mjs https://example.org/kwikibot-ci
          node lifetime.mjs
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/kwikibot-*.tgz typescript@5.9.3 @types/node@22 esbuild@0.25.0
          node bundle.mjs
          npx tsc -p .
          npx tsc -p tsconfig.legacy.json
          node build/bot.js
          node build/typed/all.js
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/test_release_updates.py
          python3 .github/scripts/test_check_ts_coverage.py
          python3 .github/scripts/check_ts_coverage.py
          python3 .github/scripts/test_check_ts_unions.py
          python3 .github/scripts/check_ts_unions.py

      - name: Upload coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: build/reports/kover/report.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'

  # Wikimedia runs this week's MediaWiki; third-party wikis run releases going back years. This job starts
  # the current LTS and the latest release in Docker and runs LocalWikiTest against each, failing on any
  # warning, so a value that only the newest MediaWiki accepts fails here.
  mediawiki:
    name: MediaWiki ${{ matrix.mediawiki }}
    strategy:
      fail-fast: false
      matrix:
        mediawiki: [lts, latest]
    runs-on: ubuntu-latest
    env:
      KWIKI_MEDIAWIKI: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Start MediaWiki ${{ matrix.mediawiki }}
        run: bash .github/mediawiki/start.sh ${{ matrix.mediawiki }} 8080

      - name: Run the live tests against it
        run: ./gradlew :kwikibot-client:liveTest --tests 'com.fenakhay.kwikibot.client.LocalWikiTest' --stacktrace

      - name: Show what the wiki logged
        if: failure()
        run: docker logs kwikibot-mediawiki

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mediawiki-${{ matrix.mediawiki }}-test-reports
          path: kwikibot-client/build/reports/tests/liveTest/

  dependency-graph:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c

  jvm21:
    name: Test on JDK 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Run the JVM tests on JDK 21
        run: ./gradlew jvm21Test --stacktrace

  node-minimum:
    name: Test on the oldest Node the package allows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.3.0

      - name: Run the package's tests on that Node
        run: ./gradlew :kwikibot-js:jsNodeTest :kwikibot-js:jsNodeProductionLibraryDistribution -PnodeVersion=22.3.0 --stacktrace

      - name: Smoke-test the npm package
        run: |
          npm pack ./kwikibot-js/build/dist/js/productionLibrary --pack-destination "$RUNNER_TEMP"
          cd kwikibot-js/smoke
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/kwikibot-*.tgz
          node detect.mjs https://example.org/kwikibot-ci
          node dump.mjs
          node fleet.mjs https://example.org/kwikibot-ci
          node lifetime.mjs
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/kwikibot-*.tgz typescript@5.9.3 @types/node@22 esbuild@0.25.0
          node bundle.mjs
          npx tsc -p .
          npx tsc -p tsconfig.legacy.json
          node build/bot.js
          node build/typed/all.js
