name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linuxX64
            binary: kwikibot-cli/build/bin/linuxX64/releaseExecutable/kwikibot.kexe
          - os: macos-26
            target: macosArm64
            binary: kwikibot-cli/build/bin/macosArm64/releaseExecutable/kwikibot.kexe
          - os: windows-latest
            target: mingwX64
            binary: kwikibot-cli/build/bin/mingwX64/releaseExecutable/kwikibot.exe
            skip: -x linuxX64Test
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check, and link the release kwikibot
        run: ./gradlew check detekt checkKotlinAbi koverXmlReport :kwikibot-cli:${{ matrix.target }}AppArchive -x liveTest ${{ matrix.skip }} --stacktrace

      - name: Smoke-test the release kwikibot
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          "$BINARY" version
          "$BINARY" detect https://en.wiktionary.org
          "$BINARY" whoami --contact https://example.org/kwikibot-ci

      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 26

      - name: Smoke-test the npm package
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./gradlew :kwikibot-js:jsNodeProductionLibraryDistribution --stacktrace
          npm pack ./kwikibot-js/build/dist/js/productionLibrary --pack-destination "$RUNNER_TEMP"
          cd kwikibot-js/smoke
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/fenakhay-kwikibot-*.tgz
          node detect.mjs https://example.org/kwikibot-ci

      - name: Upload coverage to Codecov
        if: always() && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'

  # Wikimedia runs this week's MediaWiki; third-party wikis run releases going back years. This job starts
  # the current LTS and the latest release in Docker and runs LocalWikiTest against each, failing on any
  # warning, so a value that only the newest MediaWiki accepts fails here.
  mediawiki:
    name: MediaWiki ${{ matrix.mediawiki }}
    strategy:
      fail-fast: false
      matrix:
        mediawiki: [lts, latest]
    runs-on: ubuntu-latest
    env:
      KWIKI_MEDIAWIKI: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Start MediaWiki ${{ matrix.mediawiki }}
        run: bash .github/mediawiki/start.sh ${{ matrix.mediawiki }} 8080

      - name: Run the live tests against it
        run: ./gradlew :kwikibot-client:liveTest --tests 'com.fenakhay.kwikibot.client.LocalWikiTest' --stacktrace

      - name: Show what the wiki logged
        if: failure()
        run: docker logs kwikibot-mediawiki

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mediawiki-${{ matrix.mediawiki }}-test-reports
          path: kwikibot-client/build/reports/tests/liveTest/

  dependency-graph:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@v6
