name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build detekt apiCheck koverXmlReport -x liveTest --stacktrace

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  # Wikimedia runs this week's MediaWiki; third-party wikis run releases going back years. This job starts
  # the current LTS and the latest release in Docker and runs LocalWikiTest against each, failing on any
  # warning, so a value that only the newest MediaWiki accepts fails here.
  mediawiki:
    name: MediaWiki ${{ matrix.mediawiki }}
    strategy:
      fail-fast: false
      matrix:
        mediawiki: [lts, latest]
    runs-on: ubuntu-latest
    env:
      KWIKI_MEDIAWIKI: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Start MediaWiki ${{ matrix.mediawiki }}
        run: bash .github/mediawiki/start.sh ${{ matrix.mediawiki }} 8080

      - name: Run the live tests against it
        run: ./gradlew :kwikibot-client:liveTest --tests 'com.fenakhay.kwikibot.client.LocalWikiTest' --stacktrace

      - name: Show what the wiki logged
        if: failure()
        run: docker logs kwikibot-mediawiki

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mediawiki-${{ matrix.mediawiki }}-test-reports
          path: kwikibot-client/build/reports/tests/liveTest/

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the native binary
        run: ./gradlew :kwikibot-cli:nativeCompile --stacktrace

      - name: Smoke-test the native binary
        run: |
          binary=kwikibot-cli/build/native/nativeCompile/kwikibot
          case "$RUNNER_OS" in Windows) binary="$binary.exe" ;; esac
          "$binary" version
          "$binary" detect https://en.wiktionary.org
          "$binary" whoami --contact https://example.org/kwikibot-ci

  dependency-graph:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@v6
