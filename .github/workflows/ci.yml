name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build detekt apiCheck koverXmlReport -x liveTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the native binary
        run: ./gradlew :kwikibot-cli:nativeCompile --stacktrace

      - name: Smoke-test the native binary
        run: |
          binary=kwikibot-cli/build/native/nativeCompile/kwikibot
          case "$RUNNER_OS" in Windows) binary="$binary.exe" ;; esac
          "$binary" version
          "$binary" detect https://en.wiktionary.org
          "$binary" whoami --contact https://example.org/kwikibot-ci

  dependency-graph:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@v6
