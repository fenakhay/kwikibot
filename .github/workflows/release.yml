name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a release version of the form v1.2.3"
            exit 1
          fi
          python3 .github/scripts/changelog_section.py "${tag#v}" > /dev/null
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  maven-central:
    needs: [version, package]
    runs-on: macos-26
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and check
        run: ./gradlew build jvm21Test detekt checkKotlinAbi -x liveTest -PreleaseVersion=${{ needs.version.outputs.version }} --stacktrace

      - name: Upload to the Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew nmcpPublishAggregationToCentralPortal -PreleaseVersion=${{ needs.version.outputs.version }} --stacktrace

      - name: Say what is left to do by hand
        run: echo "The deployment is on the Central Portal and stays private until it is published there." >> "$GITHUB_STEP_SUMMARY"

  npm:
    needs: [version, maven-central]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Build and test the npm package
        run: ./gradlew :kwikibot-js:check :kwikibot-js:jsNodeProductionLibraryDistribution -PreleaseVersion=${{ needs.version.outputs.version }} --stacktrace

      - name: Smoke-test the npm package
        run: |
          npm pack ./kwikibot-js/build/dist/js/productionLibrary --pack-destination "$RUNNER_TEMP"
          cd kwikibot-js/smoke
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/kwikibot-*.tgz
          node detect.mjs https://example.org/kwikibot-release
          node dump.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        working-directory: kwikibot-js/build/dist/js/productionLibrary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if npm view "kwikibot@$VERSION" version > /dev/null 2>&1; then
            echo "kwikibot@$VERSION is already on npm"
          else
            npm publish --provenance --access public
          fi

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            target: mingwX64
            binary: kwikibot-cli/build/bin/mingwX64/releaseExecutable/kwikibot.exe
          - os: macos-26
            name: macos-arm64
            target: macosArm64
            binary: kwikibot-cli/build/bin/macosArm64/releaseExecutable/kwikibot.kexe
          - os: ubuntu-latest
            name: linux-x64
            target: linuxX64
            binary: kwikibot-cli/build/bin/linuxX64/releaseExecutable/kwikibot.kexe
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the native binary
        run: ./gradlew :kwikibot-cli:${{ matrix.target }}AppArchive -PreleaseVersion=${{ needs.version.outputs.version }} --stacktrace

      - name: Build the Linux packages
        if: matrix.os == 'ubuntu-latest'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/nfpm.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz"
          echo "a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" nfpm
          export PATH="$RUNNER_TEMP/bin:$PATH"
          nfpm package -p deb -f nfpm.yaml -t kwikibot-cli/build/distributions/
          nfpm package -p rpm -f nfpm.yaml -t kwikibot-cli/build/distributions/

      - name: Smoke-test the native binary
        env:
          binary: ${{ matrix.binary }}
        run: |
          if [[ ! -x "$binary" ]]; then
            echo "::error::No native binary at $binary"
            ls -la "$(dirname "$binary")" || true
            exit 1
          fi
          "$binary" version
          "$binary" detect https://en.wiktionary.org
          "$binary" whoami --contact https://example.org/kwikibot-ci

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: kwikibot-cli/build/distributions/*
          if-no-files-found: error

  release:
    needs: [version, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksum everything
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released"
          else
            python3 .github/scripts/changelog_section.py "$VERSION" "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" artifacts/*
          fi

  scoop:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: package-windows-x64
          path: artifacts

      - name: Point the bucket at the new release
        run: |
          archive="artifacts/kwikibot-${{ needs.version.outputs.version }}-windows-x64.zip"
          python3 .github/scripts/update_scoop.py \
            "${{ needs.version.outputs.version }}" "$(sha256sum "$archive" | cut -d' ' -f1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/kwikibot.json
          if git diff --cached --quiet; then
            echo "The bucket already points at $GITHUB_REF_NAME"
          else
            git commit -m "build(scoop): point the bucket at $GITHUB_REF_NAME"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi

  homebrew:
    needs: [version, release]
    if: vars.HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write the formula into the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAP: ${{ vars.HOMEBREW_TAP }}
        run: |
          set -euo pipefail
          digest() {
            archive="artifacts/kwikibot-$VERSION-$1.tgz"
            test -f "$archive" || { echo "::error::no archive at $archive"; exit 1; }
            sha256sum "$archive" | cut -d' ' -f1
          }

          git clone "https://x-access-token:$GH_TOKEN@github.com/$TAP.git" tap
          python3 .github/scripts/brew_formula.py \
            "$GITHUB_REPOSITORY" "$VERSION" tap/Formula/kwikibot.rb \
            "$(digest macos-arm64)" "$(digest linux-x64)"

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kwikibot.rb
          git commit -m "kwikibot $VERSION"
          git push || (git pull --rebase && git push)
